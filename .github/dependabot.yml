version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Base images are pinned to patch versions; bump them when security releases land
  - package-ecosystem: "docker"
    directories:
      - "/app"
      - "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # npm / uv: version updates off (limit 0, handled manually via ncu);
  # security updates still arrive, grouped into one PR per directory.
  - package-ecosystem: "npm"
    directories:
      - "/app"
      - "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/tools/tw-redive-db-fetcher"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
